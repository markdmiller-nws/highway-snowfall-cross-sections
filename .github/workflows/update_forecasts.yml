name: Update Weather Forecast Graphics

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime via GitHub button

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy matplotlib scipy pillow

      - name: Run Forecast Batch Script
        run: python Snowfall_Cross_Sections.py

      - name: Commit and Push Updated Graphics
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add output_graphics/ assets/ elevation_cache_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update forecast graphics [skip ci]" && git push)
